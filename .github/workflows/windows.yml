name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check Windows packages
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build CatgirlStudio.slnx -c Release

      - name: Validate catalogs
        run: dotnet run --project tools/CatalogCheck -c Release --no-build

      - name: Package Windows x64 executables
        shell: pwsh
        run: |
          $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          dotnet publish src/CatgirlStudio.App -c Release --self-contained false -p:Version=$version -o publish/ci/framework-dependent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet publish src/CatgirlStudio.App -c Release --self-contained true -p:Version=$version -o publish/ci/self-contained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Write-Package($source, $package) {
            Compress-Archive -Path "$source/*" -DestinationPath "publish/$package"
            $hash = (Get-FileHash -LiteralPath "publish/$package" -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "publish/$package.sha256" -Value ("$hash  $package" + [char]10) -Encoding ascii -NoNewline
          }

          Write-Package 'publish/ci/framework-dependent' 'CatGirlStudio-win-x64.zip'
          Write-Package 'publish/ci/self-contained' 'CatGirlStudio-win-x64-self-contained.zip'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./tools/Add-RealEsrgan.ps1 -AppDirectory publish/ci/self-contained
            Write-Package 'publish/ci/self-contained' 'CatGirlStudio-win-x64-complete.zip'
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CatGirlStudio-win-x64
          path: publish/CatGirlStudio-win-x64*.zip*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CatGirlStudio-win-x64

      - name: Verify package checksums
        run: |
          sha256sum --check CatGirlStudio-win-x64.zip.sha256 \
            CatGirlStudio-win-x64-self-contained.zip.sha256 \
            CatGirlStudio-win-x64-complete.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "$GITHUB_REF_NAME" \
            CatGirlStudio-win-x64.zip CatGirlStudio-win-x64.zip.sha256 \
            CatGirlStudio-win-x64-self-contained.zip CatGirlStudio-win-x64-self-contained.zip.sha256 \
            CatGirlStudio-win-x64-complete.zip CatGirlStudio-win-x64-complete.zip.sha256 \
            --verify-tag --title "CatGirlStudio $GITHUB_REF_NAME" \
            --notes 'Choose the complete Windows x64 ZIP to get the .NET runtime and local Real-ESRGAN upscaling together. Extract the whole ZIP and run CatgirlStudio.exe. Upscaling requires a Vulkan-capable GPU and driver. Smaller packages are also available. Launch with --fake to try the app without an API key.' \
            --generate-notes "${release_flags[@]}"
